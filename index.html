<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venoco — Sitio en construcción</title>
<style>
  :root {
    --color-primary: #0033a0;
    --color-accent-yellow: #ffed00;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: var(--color-primary);
    background-image: url('./avila.jpg');
    background-size: cover;
    background-position: center 30%;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 20, 60, 0.65);
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 32px 24px;
    text-align: center;
  }

  .logo {
    width: clamp(160px, 40vw, 320px);
    height: auto;
    display: block;
  }

  .headline {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 6vw, 72px);
    line-height: 1.05;
    color: var(--color-accent-yellow);
    letter-spacing: -0.5px;
    text-transform: uppercase;
  }

  @media (max-width: 480px) {
    .content { gap: 28px; }
  }
</style>
</head>
<body>
  <div class="overlay" aria-hidden="true"></div>
  <main class="content">
    <img class="logo" src="./venoco.png" alt="Venoco">
    <p class="headline">66 años en Venezuela</p>
  </main>
</body>
</html>
